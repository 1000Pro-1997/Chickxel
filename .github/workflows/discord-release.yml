name: Discord release announcement

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      DISCORD_RELEASE_WEBHOOK:
        required: true
  workflow_dispatch:
    inputs:
      message_id:
        description: "Existing webhook message to update (empty = new announcement)"
        required: false
        type: string
      tag:
        description: "Published release tag (empty = latest stable release)"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: discord-release-${{ inputs.tag || github.event.release.tag_name || 'latest' }}
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send release details to Discord
        env:
          MESSAGE_ID: ${{ inputs.message_id }}
          GH_TOKEN: ${{ github.token }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ.get("RELEASE_TAG", "").strip()
          if not tag:
              event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
              tag = event.get("release", {}).get("tag_name", "")
          endpoint = ("tags/" + urllib.parse.quote(tag, safe="")) if tag else "latest"
          request = urllib.request.Request(
              "https://api.github.com/repos/" + repo + "/releases/" + endpoint,
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json", "User-Agent": "GPixel-release-notify"})
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)
          if release.get("draft"):
              raise SystemExit("Refusing to announce a draft release")
          url = release["html_url"]
          headings = []
          fence = None
          english_section = False
          section_level = None
          saw_english = False
          standalone_english = []
          for line in (release.get("body") or "").splitlines():
              marker = re.match(r"^ {0,3}(`{3,}|~{3,})", line)
              if marker:
                  token = marker.group(1)
                  if fence is None:
                      fence = token
                  elif token[0] == fence[0] and len(token) >= len(fence):
                      fence = None
                  continue
              if fence:
                  continue
              heading = re.match(r"^ {0,3}(#{2,6})\s+(.+?)\s*$", line)
              if not heading:
                  continue
              title = re.sub(r"\s+#+\s*$", "", heading.group(2)).strip()
              level = len(heading.group(1))
              if title.lower() == "english":
                  english_section = True
                  saw_english = True
                  section_level = level
                  continue
              if section_level is not None and level <= section_level:
                  english_section = False
              if title.lower() in ("한국어", "korean"):
                  continue
              if title and not re.search(r"[가-힣]", title) and re.search(r"[A-Za-z]", title):
                  standalone_english.append("- " + title)
                  if english_section:
                      headings.append("- " + title)
          if not saw_english:
              headings = standalone_english
          body = "\n".join(headings).strip() or "See the full release notes for details."
          if len(body) > 3800:
              body = body[:3750].rsplit("\n", 1)[0] + "\n\nSee the full release notes for more."
          downloads = []
          labels = {"Gpixel-windows-x64.zip": "Windows",
                    "Gpixel-macos-arm64.zip": "macOS Apple Silicon",
                    "Gpixel-macos-x64.zip": "macOS Intel"}
          for asset in release.get("assets", []):
              label = labels.get(asset["name"])
              if label:
                  downloads.append("[" + label + "](" + asset["browser_download_url"] + ")")
          embed = {"title": ("GPixel " + release["tag_name"] + " Update")[:256],
                   "url": url, "description": body, "color": 0x37CDBE,
                   "fields": [{"name": "Downloads", "value": " · ".join(downloads) or "[Release page](" + url + ")"},
                              {"name": "Full release notes", "value": "[View on GitHub](" + url + ")"}],
                   "footer": {"text": "GPixel Updates"}}
          payload = {"username": "GPixel Updates", "allowed_mentions": {"parse": []}, "embeds": [embed]}
          hook = os.environ.get("DISCORD_RELEASE_WEBHOOK", "").rstrip("/")
          if not hook.startswith("https://discord.com/api/webhooks/"):
              raise SystemExit("DISCORD_RELEASE_WEBHOOK is missing or invalid")
          message_id = os.environ.get("MESSAGE_ID", "").strip()
          if message_id and not message_id.isdigit():
              raise SystemExit("MESSAGE_ID must contain digits only")
          delivery_url = hook + ("/messages/" + message_id if message_id else "?wait=true")
          request = urllib.request.Request(delivery_url,
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "GPixel-release-notify"},
              method="PATCH" if message_id else "POST")
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  message = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit("Discord delivery failed (HTTP " + str(error.code) + ")") from None
          except urllib.error.URLError:
              raise SystemExit("Discord delivery connection failed; inspect channel before retrying") from None
          print("Discord announcement sent for " + release["tag_name"] + "; message ID " + message["id"])
          PY
