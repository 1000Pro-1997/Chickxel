# 태그(v1.2.0 등)를 푸시하면 Windows exe와 macOS .app(Apple Silicon/Intel)을 만들어 GitHub 릴리스에 올린다.
# 수동 실행(workflow_dispatch)하면 릴리스 없이 Actions 아티팩트로만 받을 수 있다.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test tests/Gpixel.Core.Tests -c Release

      - name: Publish
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          ./publish.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: gpixel
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 릴리스 설명 = CHANGELOG.md의 이 버전 절(없으면 GitHub 자동 노트). CHANGELOG.md는 파일로도 올려 앱 업데이트 창이 API 없이 읽는다.
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { inside = (index($0, "## " tag " ") == 1 || $0 == "## " tag); next }
            /^# / { inside = 0 }
            inside { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          if [ -s dist/RELEASE_NOTES.md ]; then NOTES=(--notes-file dist/RELEASE_NOTES.md); else NOTES=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt CHANGELOG.md --title "Gpixel $GITHUB_REF_NAME" "${NOTES[@]}"

  announce:
    needs: build
    if: github.ref_type == 'tag'
    permissions:
      contents: read
    uses: ./.github/workflows/discord-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
