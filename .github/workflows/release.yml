# 태그(v1.2.0 등)를 푸시하면 Windows exe와 macOS .app(Apple Silicon/Intel)을 만들어 GitHub 릴리스에 올린다.
# 수동 실행(workflow_dispatch)하면 릴리스 없이 Actions 아티팩트로만 받을 수 있다.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test tests/Gpixel.Core.Tests -c Release

      - name: Publish
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          ./publish.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: gpixel
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 릴리스 설명 = CHANGELOG.md(영어)의 이 버전 절, 이어서 구분선·"## 한국어" 아래 CHANGELOG.ko.md의 같은 절(영어 절이 없으면 한국어만,
          # 둘 다 없으면 GitHub 자동 노트). CHANGELOG.md·CHANGELOG.ko.md는 파일로도 올려 앱 업데이트 창이 API 없이 읽는다.
          section() {
            [ -f "$1" ] || return 0
            awk -v tag="$GITHUB_REF_NAME" '
              /^## / { inside = (index($0, "## " tag " ") == 1 || $0 == "## " tag); next }
              /^# / { inside = 0 }
              inside { print }
            ' "$1"
          }
          EN="$(section CHANGELOG.md)"
          KO="$(section CHANGELOG.ko.md)"
          : > dist/RELEASE_NOTES.md
          if [ -n "$EN" ]; then printf '%s\n' "$EN" >> dist/RELEASE_NOTES.md; fi
          if [ -n "$KO" ]; then
            if [ -n "$EN" ]; then printf '\n---\n\n## 한국어\n\n' >> dist/RELEASE_NOTES.md; fi
            printf '%s\n' "$KO" >> dist/RELEASE_NOTES.md
          fi
          if [ -s dist/RELEASE_NOTES.md ]; then NOTES=(--notes-file dist/RELEASE_NOTES.md); else NOTES=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt CHANGELOG.md CHANGELOG.ko.md --title "Gpixel $GITHUB_REF_NAME" "${NOTES[@]}"

  announce:
    needs: build
    if: github.ref_type == 'tag'
    permissions:
      contents: read
    uses: ./.github/workflows/discord-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
