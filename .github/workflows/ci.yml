# 푸시·풀 리퀘스트마다 빌드하고 Core 테스트를 돌린다(Windows·macOS·Linux).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Gpixel.sln -c Release

      - name: Test
        run: dotnet test tests/Gpixel.Core.Tests -c Release --no-build
