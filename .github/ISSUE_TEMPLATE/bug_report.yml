name: 버그 신고
description: 잘못 동작하는 것을 알려 주세요
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      description: 무엇을 했고, 무엇을 기대했고, 실제로 어떻게 됐는지. 스크린샷이 있으면 붙여 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 해 보는 방법
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: version
    attributes:
      label: Chickxel 버전
      description: 도움말 > Chickxel 정보…에 나옵니다.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
